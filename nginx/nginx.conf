# =============================================================================
# Discord Clone — Nginx reverse proxy (runs inside its own container)
# Routes:  /        → frontend static container
#          /api/*   → backend REST API
#          /ws      → backend WebSocket gateway (Upgrade passthrough)
# This file is mounted at /etc/nginx/conf.d/default.conf, i.e. INSIDE http{}.
# Production: add Let's Encrypt certs (or jrcs/letsencrypt-nginx-proxy-companion)
# and enable the TLS 1.2+ server block at the bottom.
# =============================================================================

# Docker embedded DNS — REQUIRED so nginx re-resolves container names instead
# of pinning stale IPs after containers are recreated (avoids 502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # ---- Global hardening ---------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 100m;      # media uploads go DIRECTLY to MinIO;
                                    # this covers fallback REST uploads only

    # ---- Static frontend ------------------------------------------------------
    location / {
        set $fe discord_frontend;
        proxy_pass http://$fe;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Auth endpoints (stricter bucket declared in http-zones.conf) ---------
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        set $be discord_backend;
        proxy_pass http://$be;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- REST API --------------------------------------------------------------
    # Backend also enforces per-user rate limits and emits
    # X-RateLimit-Limit / X-RateLimit-Remaining / Retry-After (429 on excess).
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        set $be discord_backend;
        proxy_pass http://$be;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- WebSocket gateway (/ws?token=<JWT>) ------------------------------------
    # Long-lived bidirectional TCP connection after the HTTP Upgrade handshake.
    location /ws {
        set $be discord_backend;
        proxy_pass http://$be;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Must exceed heartbeat_interval*2 so idle-but-alive sockets survive
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}

# ---- Upstreams (kept out of default.conf; defined in upstreams.conf) --------

