# Mounted at /etc/nginx/conf.d/00-http-zones.conf (inside http{}, before servers).
# Rate-limit zones shared by all server blocks.
limit_req_zone $binary_remote_addr zone=api:10m  rate=50r/s;   # Discord-style global 50 rps
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;    # brute-force protection
